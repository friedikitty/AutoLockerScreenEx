name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish AutoLockerScreenEx/AutoLockerScreenEx.csproj -c Release -o publish

      - name: Package
        run: |
          Remove-Item publish/*.pdb
          Compress-Archive publish/* AutoLockerScreenEx.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AutoLockerScreenEx
          path: AutoLockerScreenEx.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} AutoLockerScreenEx.zip --title ${{ github.ref_name }} --generate-notes
